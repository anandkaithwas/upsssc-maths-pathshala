name: Deploy quiz-progress feature preview

on:
  push:
    branches:
      - audit/general-quiz-progress-v1

permissions:
  contents: read

concurrency:
  group: upsssc-maths-pathshala-quiz-progress-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/audit/general-quiz-progress-v1'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: audit/general-quiz-progress-v1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Verify isolated staging target
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_STAGING_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_PAGES_PROJECT" = "upsssc-maths-pathshala-staging"
      - name: Deploy only to isolated staging Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=upsssc-maths-pathshala-staging --branch=audit-general-quiz-progress-v1
