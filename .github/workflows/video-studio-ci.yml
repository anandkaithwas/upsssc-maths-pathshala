name: Video Studio Build

on:
  push:
    branches:
      - feature/motion-canvas-video-studio
    paths:
      - "video-studio/**"
      - ".github/workflows/video-studio-ci.yml"
  pull_request:
    paths:
      - "video-studio/**"
      - ".github/workflows/video-studio-ci.yml"

jobs:
  build-video-studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video-studio/package-lock.json
      - run: npm install
      - run: npm run build
