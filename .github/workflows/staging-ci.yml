name: Staging CI
on:
  push:
    branches:
      - audit/staging-hardening-v1
  pull_request:
    branches:
      - audit/staging-hardening-v1
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
