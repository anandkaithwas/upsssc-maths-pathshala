name: Homepage Staging CI
on:
  push:
    branches:
      - audit/homepage-modern-v1
      - audit/general-quiz-progress-v1
  pull_request:
    branches:
      - audit/homepage-modern-v1
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
